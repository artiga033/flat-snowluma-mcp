name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APP_NAME: flat-snowluma-mcp

jobs:
  check:
    uses: ./.github/workflows/check.yml

  version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match version tags to Cargo.toml
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
              assert ref == f'refs/tags/v{version}', f'Tag {ref} does not match v{version}'

  build:
    name: Build (${{ matrix.config.target }})
    needs: [check, version]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            extension: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            extension: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            extension: ''
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.config.target }}
      - name: Build
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: ${{ matrix.config.target }}
          args: --release --locked
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.config.target }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/$APP_NAME" README.md LICENSE dist/package/
          cd dist/package
          zip -j "../$APP_NAME-$TARGET.zip" "$APP_NAME" README.md LICENSE
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.config.target }}
          EXTENSION: ${{ matrix.config.extension }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:APP_NAME$env:EXTENSION", README.md, LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$env:APP_NAME-$env:TARGET.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.config.target }}
          path: dist/${{ env.APP_NAME }}-${{ matrix.config.target }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flat-snowluma-mcp-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
